name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: cd docs && npm ci
      - name: Test build website
        run: cd docs && npm run build

  # ビルド（アップロード）とデプロイを別のジョブに分ける。
  # 同じジョブ内だと、アップロード直後の成果物を deploy-pages が見つけられず失敗するため。
  build:
    name: Build for GitHub Pages
    runs-on: ubuntu-latest
    needs: build-check
    # Deploy to GitHub Pages only on pushes to main branch
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: cd docs && npm ci
      # 簡易パスワード認証（docs/src/theme/Root.tsx）のパスワード。
      # 未設定のまま認証なしで公開しないよう、空ならここで止める。
      - name: Check site password
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::Secret SITE_PASSWORD が未設定です。Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi
      - name: Build website
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: cd docs && npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # 同時に複数のデプロイが走らないようにする（実行中のデプロイは中断しない）
    concurrency:
      group: pages
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
